name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in your way today.
      placeholder: "I record tutorials and want to pause while I prepare the next step."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Rough ideas are fine.
  - type: dropdown
    id: area
    attributes:
      label: Which part of QClipz?
      options:
        - Recording (screen, area, window)
        - Audio
        - Area overlay
        - Review / crop / saving
        - Installer
        - Something else
  - type: checkboxes
    id: roadmap
    attributes:
      label: Before you post
      options:
        - label: I checked the Roadmap in the README and existing issues.
          required: true
